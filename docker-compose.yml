services:
  postgres:
    image: postgres:16-alpine
    container_name: anitabia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: anitabia
      POSTGRES_USER: anitabia
      POSTGRES_PASSWORD: anitabia
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
