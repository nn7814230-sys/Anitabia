services:
  postgres:
    image: postgres:16-alpine
    container_name: anitabia-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: anitabia
      POSTGRES_USER: anitabia
      POSTGRES_PASSWORD: anitabia
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U anitabia -d anitabia"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 4000
      SITE_URL: https://anitabia.ru
      DATABASE_URL: postgres://anitabia:anitabia@postgres:5432/anitabia
      KODIK_API_TOKEN: ${KODIK_API_TOKEN:-}
      KODIK_API_URL: ${KODIK_API_URL:-https://kodik-api.com}
      TURN_HOST: ${TURN_HOST:-anitabia.ru}
      TURN_PORT: ${TURN_PORT:-3478}
      TURN_SECRET: ${TURN_SECRET:?TURN_SECRET must be set in .env}
    expose:
      - "4000"
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_URL: /api/v1
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      api:
        condition: service_started

  turn:
    image: coturn/coturn:4.15.0-r0
    restart: unless-stopped
    network_mode: host
    command:
      - --no-tls
      - --no-dtls
      - --log-file=stdout
      - --listening-port=${TURN_PORT:-3478}
      - --listening-ip=${TURN_EXTERNAL_IP:-89.125.61.215}
      - --relay-ip=${TURN_EXTERNAL_IP:-89.125.61.215}
      - --min-port=49160
      - --max-port=49200
      - --realm=anitabia.ru
      - --server-name=anitabia.ru
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SECRET:?TURN_SECRET must be set in .env}
      - --external-ip=${TURN_EXTERNAL_IP:-89.125.61.215}
      - --no-multicast-peers
      - --pidfile=/var/tmp/turnserver.pid
      - --stale-nonce=600
      - --user-quota=8
      - --total-quota=200
      - --max-bps=1000000

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      web:
        condition: service_started

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
